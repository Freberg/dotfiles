# general
set -g base-index 1
setw -g pane-base-index 1
set -s extended-keys on

# splits
bind-key -n M-| split-window -h -c "#{pane_current_path}"
bind-key -n M-- split-window -v -c "#{pane_current_path}"

bind-key -n M-h select-pane -L
bind-key -n M-l select-pane -R
bind-key -n M-k select-pane -U
bind-key -n M-j select-pane -D

bind-key -n M-H swap-pane -U
bind-key -n M-L swap-pane -D

# tabs
bind-key -n C-t new-window -c "#{pane_current_path}"
bind-key -n C-w kill-pane

bind-key -n M-1 select-window -t :=1
bind-key -n M-2 select-window -t :=2
bind-key -n M-3 select-window -t :=3
bind-key -n M-4 select-window -t :=4
bind-key -n M-5 select-window -t :=5
bind-key -n M-6 select-window -t :=6
bind-key -n M-7 select-window -t :=7
bind-key -n M-8 select-window -t :=8
bind-key -n M-9 select-window -t :=9

bind-key -n C-Tab next-window
bind-key -n C-S-Tab previous-window 

# commands
bind -n C-M-s display-popup -E -w 75% -h 60% "~/.config/scripts/ui/tmux_session_menu.sh"
bind -n M-e display-popup -E "~/workspace/domyjob.sh/frontend/dashboard.tmux.sh"

# tab bar
set -g status-left "#[fg=cyan,bold] #S #[fg=brightblack]${SEPARATOR_LEFT_THIN} "
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g window-status-separator "#[fg=brightblack]${SEPARATOR_LEFT_THIN}"
